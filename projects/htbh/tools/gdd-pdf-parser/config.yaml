# GDD XP Card Parser Configuration
# ─────────────────────────────────────────────────────────────────────────────
# How XP cards are identified in the GDD PDF.
# The parser detects headings that are immediately followed by one of the
# known_section_headers below — that heading becomes the XP card title.
known_section_headers:
  - "Intention | Requirements"
  - "Intention|Requirements"
  - "Player Interaction"
  - "World/ Feature/ Physics Interaction"
  - "World/Feature/Physics Interaction"
  - "Vision Statement"
  - "Vision Statement (Feel)"
  - "Balancing Variables"
  - "Mechanic Description"
  - "Required Feedback"
  - "Last Update"
  # colon-suffix variants (as they appear in the actual GDD PDF)
  - "Intention | Requirements:"
  - "Player Interaction:"
  - "World/ Feature/ Physics Interaction:"
  - "Balancing Variables:"
  - "Mechanic Description:"
  - "Last Update:"

# Sections to extract from each GDD XP card (exact text as it appears in the PDF).
# Order here is not important — sections are mapped individually below.
extract_sections:
  - "Intention | Requirements"
  - "Intention | Requirements:"
  - "Player Interaction"
  - "Player Interaction:"
  - "World/ Feature/ Physics Interaction"
  - "World/ Feature/ Physics Interaction:"
  - "Balancing Variables"
  - "Balancing Variables:"
  - "Mechanic Description"
  - "Mechanic Description:"

# How extracted GDD sections map to TechXPCard output sections.
# Keys are matched fuzzily (lowercased, stripped) against what was extracted.
section_mapping:
  "Intention | Requirements": "High Level Description"
  "Intention | Requirements:": "High Level Description"
  "Player Interaction": "Basic Requirements"
  "Player Interaction:": "Basic Requirements"
  "World/ Feature/ Physics Interaction": "Relates to"
  "World/ Feature/ Physics Interaction:": "Relates to"
  "Balancing Variables": "Designer Inputs / Balancing Inputs"
  "Balancing Variables:": "Designer Inputs / Balancing Inputs"
  "Mechanic Description": "High Level Description"
  "Mechanic Description:": "High Level Description"

# Fixed contact info written into every output card.
contacts:
  - "FABIAN KRÜGER"
  - "SERPH"

# Minimum font size (pt) that counts as a heading — tunable if detection misses cards.
heading_min_size: 13.0
